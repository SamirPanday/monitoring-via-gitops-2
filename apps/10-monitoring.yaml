---
# Wave 4: tenant onboarding ApplicationSet (one Application per tenants/<name>)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenancy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME/monitoring-only.git
    targetRevision: main
    path: appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
