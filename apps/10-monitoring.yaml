---
# Wave 2: network policies, ServiceMonitors and the Grafana exposure through Istio (edit charts/monitoring-config/values.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME/monitoring-only.git
    targetRevision: main
    path: charts/monitoring-config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
---
# Wave 3: Grafana team/folder/member/dashboard reconciler
apiVersion: argoproj.io/v1alpha1
