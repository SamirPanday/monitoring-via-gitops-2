# Wave 4: deploy the acme tenant from the reusable tenant chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onboard-acme
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/SamirPanday/monitoring-via-gitops-2.git
    targetRevision: main
    path: charts/tenant
    helm:
      valueFiles:
        - ../../tenants/acme/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
