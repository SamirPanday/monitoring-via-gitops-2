# Demo workload for acme: nginx, Prometheus exporter, structured logs and traffic generation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-acme
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/SamirPanday/monitoring-via-gitops-2.git
    targetRevision: main
    path: examples/demo-app
    helm:
      valueFiles:
        - ../../tenants/acme/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: acme
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 15
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
