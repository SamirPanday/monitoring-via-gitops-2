# Environment-specific settings of the target cluster. The monitoring namespace is fixed to "monitoring".

networkPolicies:
  enabled: false
  # Namespace of the ingress gateway pods that forward traffic to Grafana.
  gatewayNamespace: istio-ingress

# Scrape configs for platform components. They are harmless if the component is absent (no targets are found).
serviceMonitors:
  longhorn:
    enabled: true
    namespace: longhorn-system
  istiod:
    enabled: true
    namespace: istio-system
  ingressGateway:
    enabled: true
    namespace: istio-ingress
    selector:
      istio: ingressgateway

# Exposes Grafana through an existing Istio ingress gateway. Set enabled=false to use port-forward instead.
exposure:
  enabled: false
  host: grafana.poc.local
  service:
    name: grafana
    port: 80
  gateway:
    # true: create a Gateway that serves the host. false: attach to an existing Gateway <namespace>/<name>.
    create: false
    namespace: istio-ingress
    name: main-gateway
    selector:
      istio: ingressgateway
  tls:
    # Issues a certificate with cert-manager into the gateway namespace (secret must exist there when create=true).
    enabled: false
    issuerKind: ClusterIssuer
    issuerName: poc-ca
    secretName: grafana-tls
